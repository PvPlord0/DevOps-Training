apiVersion: v1
kind: Pod
metadata:
  labels:
    io.kompose.service: analytics-job
  name: analytics-job
spec:
  containers:
    - args:
        - python
        - job.py
      env:
        - name: BOOKING_SERVICE_URL
          value: http://booking-cont:8083
        - name: CATALOG_SERVICE_URL
          value: http://catalog-cont:8081
        - name: REDIS_URL
          value: redis://redis-cont:6379/0
        - name: SNAPSHOT_KEY
          value: analytics:snapshot
      image: localhost/analytics-image:latest
      name: analytics-job
  restartPolicy: Never
