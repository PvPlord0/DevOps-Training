apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-catalog
  labels:
    app: eventhub-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventhub-catalog
  template:
    metadata:
      labels:
        app: eventhub-catalog
    spec:
      containers:
        - name: catalog-service
          image: docker.io/20230387/legacy-catalog-java:1.0.0
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            # Database Configuration
            - name: DB_HOST
              value: "eventhub-mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "catalog_user"
            - name: DB_PASS
              value: "catalog_pass"
            - name: DB_NAME
              value: "eventhub_catalog"
            # Spring Datasource Configuration
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://eventhub-mysql:3306/eventhub_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: "catalog_user"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "catalog_pass"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.MySQL8Dialect"
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: eventhub-catalog
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app: eventhub-catalog
