apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-ai-insights
  labels:
    app: eventhub-ai-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventhub-ai-insights
  template:
    metadata:
      labels:
        app: eventhub-ai-insights
    spec:
      containers:
        - name: ai-insights
          image: docker.io/20230387/ai-insights:1.0.0
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: PORT
              value: "8084"
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: eventhub-ai-insights
spec:
  ports:
    - port: 8084
      targetPort: 8084
      name: http
  selector:
    app: eventhub-ai-insights
