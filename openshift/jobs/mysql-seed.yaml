apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-seed
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: mysql-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z eh-mysql 3306; do echo 'Waiting for MySQL...'; sleep 2; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: mysql-seed
          image: mysql:8.4.11
          command:
            - mysql
            - -h
            - eh-mysql
            - -u
            - root
            - -prootpassword
            - -e
            - "source /seed/mysql-seed.sql"
          volumeMounts:
            - name: seed-file
              mountPath: /seed
              readOnly: true
          env:
            - name: MYSQL_PWD
              value: rootpassword
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: seed-file
          configMap:
            name: mysql-seed
