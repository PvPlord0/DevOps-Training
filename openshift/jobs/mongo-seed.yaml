apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-seed
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: mongo-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z eh-mongo 27017; do echo 'Waiting for MongoDB...'; sleep 2; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: mongo-seed
          image: image-registry.openshift-image-registry.svc:5000/crt-20230367-dev/mongo:8.0.28
          command:
            - mongosh
            - --host
            - eh-mongo
            - eventhub_bookings
            - /seed/mongo-seed.js
          volumeMounts:
            - name: seed-file
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: seed-file
          configMap:
            name: mongo-seed
