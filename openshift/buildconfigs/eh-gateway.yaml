apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: eh-gateway
  labels:
    app: eh-gateway
spec:
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: eh-gateway:latest
  postCommit: {}
  resources: {}
  runPolicy: Serial
  source:
    sourceSecret:
      name: git-credentials
    contextDir: services/api-gateway-node
    git:
      ref: Mahmoud
      uri: https://github.com/PvPlord0/DevOps-Training.git
    type: Git
  strategy:
    dockerStrategy:
      dockerfilePath: Containerfile
    type: Docker
  triggers:
    - type: ConfigChange
    - imageChange: {}
      type: ImageChange
