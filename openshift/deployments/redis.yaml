apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eh-redis
  template:
    metadata:
      labels:
        app: eh-redis
    spec:
      containers:
        - name: redis
          image: redis:8.0.2-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: eh-redis
spec:
  selector:
    app: eh-redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
