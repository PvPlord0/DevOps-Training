apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eh-booking
  template:
    metadata:
      labels:
        app: eh-booking
    spec:
      containers:
        - name: booking
          image: image-registry.openshift-image-registry.svc:5000/crt-20230367-dev/eh-booking:latest
          ports:
            - containerPort: 8083
          env:
            - name: MONGO_URI
              value: mongodb://eh-mongo:27017
            - name: MONGO_DB
              value: eventhub_bookings
            - name: RABBITMQ_URL
              value: amqp://guest:guest@eh-rabbitmq:5672/
            - name: RABBITMQ_QUEUE
              value: bookings
            - name: AI_INSIGHT_URL
              value: http://eh-insight:8084
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eh-booking
spec:
  selector:
    app: eh-booking
  ports:
    - port: 8083
      targetPort: 8083
