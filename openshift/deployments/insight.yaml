apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eh-insight
  template:
    metadata:
      labels:
        app: eh-insight
    spec:
      containers:
        - name: insight
          image: image-registry.openshift-image-registry.svc:5000/crt-20230367-dev/eh-insight:latest
          ports:
            - containerPort: 8084
          env:
            - name: OLLAMA_URL
              value: ""
            - name: OLLAMA_MODEL
              value: llama3.2:1b
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eh-insight
spec:
  selector:
    app: eh-insight
  ports:
    - port: 8084
      targetPort: 8084
