apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eh-mongo
  template:
    metadata:
      labels:
        app: eh-mongo
    spec:
      containers:
        - name: mongo
          image: image-registry.openshift-image-registry.svc:5000/crt-20230367-dev/mongo:8.0.28
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: eh-mongo
spec:
  selector:
    app: eh-mongo
  ports:
    - port: 27017
      targetPort: 27017
  clusterIP: None
