apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eh-frontend
  template:
    metadata:
      labels:
        app: eh-frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/crt-20230367-dev/eh-frontend:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: frontend-config
              mountPath: /app/config.js
              subPath: config.js
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: frontend-config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: eh-frontend
spec:
  selector:
    app: eh-frontend
  ports:
    - port: 3000
      targetPort: 3000
