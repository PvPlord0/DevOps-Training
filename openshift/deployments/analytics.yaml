apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eh-analytics
  template:
    metadata:
      labels:
        app: eh-analytics
    spec:
      containers:
        - name: analytics
          image: image-registry.openshift-image-registry.svc:5000/crt-20230367-dev/eh-analytics:latest
          ports:
            - containerPort: 8085
          env:
            - name: REDIS_URL
              value: redis://eh-redis:6379/0
            - name: BOOKING_SERVICE_URL
              value: http://eh-booking:8083
            - name: CATALOG_SERVICE_URL
              value: http://eh-catalog:8081
            - name: SNAPSHOT_KEY
              value: analytics:snapshot
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eh-analytics
spec:
  selector:
    app: eh-analytics
  ports:
    - port: 8085
      targetPort: 8085
