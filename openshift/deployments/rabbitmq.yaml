apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eh-rabbitmq
  template:
    metadata:
      labels:
        app: eh-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.4-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmqctl", "status"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmqctl", "status"]
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: rabbitmq-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eh-rabbitmq
spec:
  selector:
    app: eh-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  clusterIP: None
