apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: redis-cont
  name: redis-cont
spec:
  replicas: 1
  selector:
    io.kompose.service: redis-cont
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: redis-cont
    spec:
      containers:
        - image: ' '
          name: redis-cont
          volumeMounts:
            - mountPath: /data
              name: redis-data
      restartPolicy: Always
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - redis-cont
        from:
          kind: ImageStreamTag
          name: redis-cont:7-alpine
      type: ImageChange
